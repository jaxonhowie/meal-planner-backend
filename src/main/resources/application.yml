server:
  port: ${PORT:8080}
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:meal-planner-default-secret-key-32bytes!}
  expiry-seconds: ${JWT_EXPIRY:2592000}

upload:
  # 本地开发：固定存到 user.home/.meal-planner/uploads，无论从哪个目录启动 JVM 都一致
  # 生产/Docker：通过 UPLOAD_DIR 环境变量覆盖（如 /tmp/uploads）
  dir: ${UPLOAD_DIR:${user.home}/.meal-planner/uploads}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # 优先使用完整 URL 环境变量（TiDB Cloud 等需要 SSL 的场景）
    # 本地开发回退到分段参数
    url: ${DATABASE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:meal_planner}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:Zhy_0507}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    # baseline-on-migrate: 数据库已有表但无 flyway_schema_history 时，
    # 自动 baseline 到 V1（标记 V1 已执行），不会重建已有的表
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    encoding: UTF-8

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.mealplanner: info
